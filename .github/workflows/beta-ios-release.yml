name: iOS Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已发布Android Beta版本；从其机器回执冻结相同源码/摘要"
        required: true
        default: "4.0.0-beta.5"
      delivery:
        description: "仅补充已签名IPA归档，或同时显式上传TestFlight（不提交正式审核）"
        type: choice
        options:
          - ipa
          - testflight
          - notify-only
        required: true
        default: ipa
      ios_build_number:
        description: "留空沿用该Beta的Android码；上传重试须核对ASC后显式使用更高build"
        required: false
        default: ""

# iOS has its own serial queue; no cancellation or changes to stable/Android CI.
concurrency:
  group: beecount-ios-beta-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-beta:
    if: inputs.delivery != 'notify-only'
    name: Verify signed IPA and optionally upload TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      BETA_VERSION: ${{ inputs.version }}
      IOS_BETA_MODE: ${{ inputs.delivery }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      IOS_BUILD_NUMBER_FLOOR: ${{ vars.IOS_BUILD_NUMBER_FLOOR || '225' }}
      TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_PROVISIONING_PROFILE_WIDGET: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGET }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout trusted v4 release tooling
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set private iOS build context
        run: echo "IOS_BETA_CONTEXT=$RUNNER_TEMP/beecount-ios-beta-context.json" >> "$GITHUB_ENV"
      - name: Test iOS release gates
        run: python3 -m unittest discover -s tool/release -p 'test_ios_beta_release.py' -v
      - name: Freeze published Beta identity and check mandatory signing inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python3 tool/release/ios_beta_release.py plan
      - name: Select Xcode 26 and verify iOS SDK
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Setup locked Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable
          cache: true
      - name: Setup Ruby for the isolated CocoaPods toolchain
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install locked CocoaPods into this run only
        run: |
          export GEM_HOME="$RUNNER_TEMP/ios-beta-gems"
          export GEM_PATH="$GEM_HOME"
          gem install cocoapods -v 1.16.2 --no-document --install-dir "$GEM_HOME"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Build and verify App Store signed IPA
        run: python3 tool/release/ios_beta_release.py build
      - name: Attach verified IPA and receipt to the existing Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/ios_beta_release.py publish
      - name: Explicitly upload to TestFlight and wait for Apple processing
        if: inputs.delivery == 'testflight'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python3 tool/release/ios_beta_release.py upload
      - name: Notify Telegram with the curated Beta summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
        run: python3 tool/release/ios_beta_release.py notify
      - name: Preserve verified public artifact only
        if: always() && steps.plan.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-beta-${{ steps.plan.outputs.version }}-${{ steps.plan.outputs.build_number }}
          path: |
            ${{ steps.plan.outputs.artifact_dir }}/*.ipa
            ${{ steps.plan.outputs.artifact_dir }}/*.sha256
            ${{ steps.plan.outputs.artifact_dir }}/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove only this run's temporary signing inputs
        if: always()
        run: python3 tool/release/ios_beta_release.py cleanup

  notify-only:
    if: inputs.delivery == 'notify-only'
    name: Retry verified iOS Beta Telegram notification only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ inputs.version }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
    steps:
      - name: Checkout reviewed notification tooling
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
          persist-credentials: false
      - name: Set private notification context
        run: echo "IOS_BETA_CONTEXT=$RUNNER_TEMP/beecount-ios-beta-notification.json" >> "$GITHUB_ENV"
      - name: Verify published iOS identities without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/ios_beta_release.py notification_plan
      - name: Retry curated Telegram notice only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
        run: python3 tool/release/ios_beta_release.py notify
