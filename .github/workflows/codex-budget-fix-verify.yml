name: Codex budget fix verification

on:
  push:
    branches:
      - codex/fix-category-budget-visibility

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Check generated localization files
        run: git diff --exit-code -- lib/l10n
      - name: Format Dart files
        run: >-
          dart format
          lib/pages/budget/budget_page.dart
          lib/pages/budget/budget_edit_page.dart
          lib/data/repositories/local/local_budget_repository.dart
          test/widgets/budget_page_test.dart
          test/widgets/budget_edit_page_test.dart
          test/repositories/budget_category_dedup_test.dart
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: apply dart format"
            git push
          fi
      - name: Run budget regression tests
        run: >-
          flutter test
          test/widgets/budget_page_test.dart
          test/widgets/budget_edit_page_test.dart
          test/repositories/budget_category_dedup_test.dart
