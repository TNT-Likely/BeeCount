name: Android Beta Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "发布新 Beta，或只重发已发布 Beta 的 Telegram 通知"
        type: choice
        options:
          - release
          - notify-only
        required: true
        default: release
      source_ref:
        description: "发布模式：v4 或 v4 历史中的完整 40 位提交 SHA；仅通知模式忽略"
        required: true
        default: "v4"
      version:
        description: "Beta 版本名；发布需已提交说明，仅通知填原来已发布的版本"
        required: true
        default: "4.0.0-beta.2"
      android_version_code_floor:
        description: "发布模式：全部渠道/本地最高已交付 code；留空读仓库变量，仅通知忽略"
        required: false
        default: ""

# 与旧正式发布共用一把锁，不能被后一次 dispatch 取消。
concurrency:
  group: beecount-android-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    if: inputs.mode == 'release'
    name: Verify and publish ARM64 Beta APK
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BETA_SOURCE_REF: ${{ inputs.source_ref }}
      BETA_VERSION: ${{ inputs.version }}
      BETA_CHANNEL_FLOOR: ${{ inputs.android_version_code_floor || vars.ANDROID_VERSION_CODE_FLOOR }}
      BETA_EXPECTED_CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout trusted v4 release tooling
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set private build context path
        run: echo "BETA_CONTEXT=$RUNNER_TEMP/beecount-beta-context.json" >> "$GITHUB_ENV"
      - name: Test release gates
        run: python3 -m unittest discover -s tool/release -p 'test_*.py' -v
      - name: Check mandatory signing inputs before SDK setup
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/beta_release.py credentials
      - name: Freeze source, version floor and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_release.py plan
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install locked Android build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Setup Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable
          cache: true
      - name: Build and verify formally signed ARM64 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/beta_release.py build
      - name: Create verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_release.py publish
      - name: Notify Telegram after publication
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tool/release/beta_release.py notify
      - name: Remove temporary signing inputs
        if: always()
        run: python3 tool/release/beta_release.py cleanup

  notify-only:
    if: inputs.mode == 'notify-only'
    name: Retry Telegram notification only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ inputs.version }}
      BETA_EXPECTED_CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout reviewed notification tool
        uses: actions/checkout@v4
        with:
          ref: v4
          persist-credentials: false
      - name: Set private notification context path
        run: echo "BETA_CONTEXT=$RUNNER_TEMP/beecount-beta-notification.json" >> "$GITHUB_ENV"
      - name: Verify published prerelease and receipt identity without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_release.py notification_plan
      - name: Retry Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tool/release/beta_release.py notify
