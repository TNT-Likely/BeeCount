name: Android Beta Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "v4 或 v4 历史中的完整 40 位提交 SHA"
        required: true
        default: "v4"
      version:
        description: "Beta 版本名；对应 docs/releases/<version>.md 必须已提交"
        required: true
        default: "4.0.0-beta.2"
      android_version_code_floor:
        description: "全部渠道/本地最高已交付 code；留空读取仓库变量，缺失则拒绝"
        required: false
        default: ""

# 与旧正式发布共用一把锁，不能被后一次 dispatch 取消。
concurrency:
  group: beecount-android-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  beta:
    name: Verify and publish ARM64 Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BETA_SOURCE_REF: ${{ inputs.source_ref }}
      BETA_VERSION: ${{ inputs.version }}
      BETA_CHANNEL_FLOOR: ${{ inputs.android_version_code_floor || vars.ANDROID_VERSION_CODE_FLOOR }}
      BETA_EXPECTED_CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      BETA_CONTEXT: ${{ runner.temp }}/beecount-beta-context.json
    steps:
      - name: Checkout trusted v4 release tooling
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Test release gates
        run: python3 -m unittest discover -s tool/release -p 'test_*.py' -v
      - name: Check mandatory signing inputs before SDK setup
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/beta_release.py credentials
      - name: Freeze source, version floor and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_release.py plan
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install locked Android build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Setup Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable
          cache: true
      - name: Build and verify formally signed ARM64 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/beta_release.py build
      - name: Create verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_release.py publish
      - name: Notify Telegram after publication
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tool/release/beta_release.py notify
      - name: Remove temporary signing inputs
        if: always()
        run: python3 tool/release/beta_release.py cleanup
