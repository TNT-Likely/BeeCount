name: Beta Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "发布完整双端 Beta，或在完整交付后补发唯一通知"
        type: choice
        options: [release, notify-only]
        required: true
        default: release
      source_ref:
        description: "发布模式：v4 或其历史完整40位SHA；仅通知忽略"
        required: true
        default: "v4"
      version:
        description: "新Beta需已提交独立更新说明；仅通知填已发布版本"
        required: true
        default: "4.0.0-beta.6"
      android_version_code_floor:
        description: "全部渠道最高已交付Android code；留空读仓库变量"
        required: false
        default: ""
      ios_delivery:
        description: "默认签名IPA并完成Apple TestFlight处理；或仅归档签名IPA"
        type: choice
        options: [testflight, ipa]
        required: true
        default: testflight
      ios_build_number:
        description: "留空与Android code一致；仅Apple需要更高build时填写"
        required: false
        default: ""

# 与正式版共用串行锁。两端候选留在同一私有Runner，全部成功才公开。
concurrency:
  group: beecount-android-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: inputs.mode == 'release'
    name: Verify both platforms then publish one Beta
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      BETA_ATOMIC: "1"
      BETA_SOURCE_REF: ${{ inputs.source_ref }}
      BETA_VERSION: ${{ inputs.version }}
      BETA_CHANNEL_FLOOR: ${{ inputs.android_version_code_floor || vars.ANDROID_VERSION_CODE_FLOOR }}
      BETA_EXPECTED_CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      IOS_BETA_MODE: ${{ inputs.ios_delivery }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      IOS_BUILD_NUMBER_FLOOR: ${{ vars.IOS_BUILD_NUMBER_FLOOR || '225' }}
      TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_PROVISIONING_PROFILE_WIDGET: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGET }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout trusted v4 release tooling
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set private platform contexts
        id: contexts
        run: |
          echo "BETA_CONTEXT=$RUNNER_TEMP/beecount-beta-context.json" >> "$GITHUB_ENV"
          echo "IOS_BETA_CONTEXT=$RUNNER_TEMP/beecount-ios-beta-context.json" >> "$GITHUB_ENV"
      - name: Test release gates
        run: python3 -m unittest discover -s tool/release -p 'test_*.py' -v
      - name: Check mandatory Android signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/beta_release.py credentials
      - name: Freeze one source, version floor and curated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_release.py plan
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install locked Android build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Setup locked Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable
          cache: true
      - name: Build and verify signed ARM64 APK privately
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release/beta_release.py build
      - name: Freeze iOS from the verified private Android candidate
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python3 tool/release/ios_beta_release.py plan
      - name: Select Xcode 26 and verify iOS SDK
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Setup Ruby for isolated CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install fixed CocoaPods into this private run
        run: |
          export GEM_HOME="$RUNNER_TEMP/ios-beta-gems"
          export GEM_PATH="$GEM_HOME"
          gem install cocoapods -v 1.16.2 --no-document --install-dir "$GEM_HOME"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Build and verify App Store signed IPA privately
        run: python3 tool/release/ios_beta_release.py build
      - name: Upload TestFlight and require valid Apple processing
        if: inputs.ios_delivery == 'testflight'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python3 tool/release/ios_beta_release.py upload
      - name: Publish one Release only after both platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release/beta_atomic.py publish
      - name: Remove this run's signing inputs
        if: always() && steps.contexts.outcome == 'success'
        run: |
          python3 tool/release/ios_beta_release.py cleanup
          python3 tool/release/beta_release.py cleanup

  notify:
    needs: release
    if: always() && (inputs.mode == 'notify-only' || needs.release.result == 'success')
    name: Announce complete Beta once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BETA_VERSION: ${{ inputs.version }}
      BETA_EXPECTED_CERTIFICATE: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      IOS_DELIVERY_RESULT: "success"
      BETA_EXPECT_TESTFLIGHT: ${{ inputs.ios_delivery == 'testflight' && '1' || '0' }}
      BETA_NOTIFICATION_MANUAL_RETRY: ${{ inputs.mode == 'notify-only' && '1' || '0' }}
      TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
    steps:
      - name: Checkout reviewed unified notification tool
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
          persist-credentials: false
      - name: Set fresh private notification contexts
        run: |
          echo "BETA_CONTEXT=$RUNNER_TEMP/beecount-beta-notification.json" >> "$GITHUB_ENV"
          echo "IOS_BETA_CONTEXT=$RUNNER_TEMP/beecount-ios-beta-notification.json" >> "$GITHUB_ENV"
      - name: Verify full platform receipts and send idempotent announcement
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tool/release/beta_atomic.py announce
