  function formLeaf(title) {
    let body=''; let saveLabel='保存设置';
    if(title.includes('账本')||title==='邀请成员') {
      body=field('账本名称','text',title==='编辑账本'?state.ledger:'','如：旅行账本')+menuRow('ledger','book-open','当前账本','',state.ledger)+menuRow('leaf:主币种','coins','币种','','人民币 CNY')+field('每月起始日','number','1');
      if(title==='加入共享账本'||title==='邀请成员') body=field(title==='邀请成员'?'邀请说明':'邀请码','text','','输入邀请码或粘贴邀请链接')+`<p class="bc-note">通过 BeeCount Cloud 管理成员与账本共享。</p>`;
      if(title==='成员统计'||title==='成员权限') body=menuRow('member-role','user-round','小蜜','创建者','全部权限')+menuRow('member-role','user-round','家人','成员','可记账、可查看');
      saveLabel=title==='加入共享账本'?'查看邀请信息':title==='新建账本'?'新建账本':title==='邀请成员'?'生成邀请预览':'保存账本设置';
    } else if(title.includes('分类')) {
      body=field('分类名称','text',title.split(':')[1]||'','输入分类名称')+`<label class="bc-form-label">分类图标</label><div class="bc-category-grid">${categories.map(([n,i])=>btn('demo-select',`<span class="bc-entry-icon">${icon(i)}</span><span>${n}</span>`,n,'')).join('')}</div>`;
      saveLabel='保存分类';
    } else if(title.includes('周期账单')) {
      body=field('账单名称','text','音乐会员')+field('金额','number','18.00')+menuRow('record-account','wallet','账户','','支付宝')+menuRow('record-date','calendar-days','重复周期','','每月23日')+menuRow('ledger','book-open','账本','',state.ledger);
      saveLabel='保存周期账单';
    } else if(title==='新增账户'||title==='编辑账户') {
      body=field('账户名称','text','','如：日常银行卡')+menuRow('account-type','landmark','账户类型','','储蓄账户')+menuRow('leaf:主币种','coins','币种','','人民币 CNY')+field('当前余额','number','0.00');
      saveLabel='保存账户';
    } else if(title==='编辑预算') {
      body=field('月度总预算','number',String(totals().budget))+categories.slice(0,4).map(([n])=>field(n+'预算','number',n==='餐饮'?'1500':'1000')).join('');
      saveLabel='保存预算';
    } else if(title==='AI服务商') {
      body=menuRow('ai-provider','server','服务商','','OpenAI 兼容服务')+field('服务地址','url','','https://api.example.com/v1')+field('API Key','password','','输入服务密钥')+field('模型名称','text','','输入模型ID');
      saveLabel='保存服务配置';
    } else if(title==='AI提示词') {
      body=`<label class="bc-form-label">识别提示词<textarea class="bc-form-control" rows="8" aria-label="识别提示词">识别支付金额、时间、账户与分类。优先使用当前账本已有分类。保存前由用户确认。</textarea></label>`;
      saveLabel='保存提示词';
    } else if(title==='识别策略') {
      body=switchRow('recognizeCategory','shapes','自动匹配分类','优先使用账本已有分类')+switchRow('recognizeAccount','wallet','识别支付账户')+switchRow('autoTags','tags','关联标签');
    } else if(title==='助手记忆') {
      body=menuRow('memory-detail','brain','常用支付账户','微信、支付宝')+menuRow('memory-detail','coffee','咖啡偏好分类','饮品');
      saveLabel='管理记忆';
    } else if(title==='助手活动') {
      body=menuRow('activity-detail','chart-pie','查看本月支出','今天 09:41 · 查询已完成')+menuRow('activity-detail','book-open','读取账本分类','今天 09:41 · 查询已完成');
      saveLabel='查看活动详情';
    } else if(title==='修改PIN码') {
      body=field('新的PIN码','password','','输入4至6位数字')+field('再次确认','password','','再次输入PIN码');saveLabel='保存PIN码';
    } else if(title.startsWith('修正汇率')) {
      body=field('货币','text',title.split(':')[1]||'USD')+field('折算为人民币','number','7.10');saveLabel='保存修正汇率';
    } else if(title==='支持作者'||title==='支持开发'||title==='打赏支持') {
      body=`<div class="bc-brand-about"><div class="bc-avatar">${icon('heart')}</div><h3>谢谢你的支持</h3><p class="bc-small" style="margin-top:9px">让这只小蜜蜂飞得更远一点</p></div>`+menuRow('external:GitHub','star','在 GitHub 点一颗 Star','关注开源项目')+menuRow('external:支持开发','coffee','请开发者喝杯咖啡','查看支持方式');saveLabel='查看支持方式';
    } else if(title==='给应用评分') {
      body=`<div class="bc-brand-about"><div class="bc-avatar">${icon('star')}</div><h3>喜欢蜜蜂记账吗？</h3><p class="bc-small" style="margin-top:10px">你的评价，是我们继续打磨的动力。</p></div>`;saveLabel='前往 App Store';
    } else if(title==='问题反馈') {
      body=field('问题描述','text','','描述你遇到的问题')+`<label class="bc-form-label">详细说明<textarea rows="5" class="bc-form-control" placeholder="发生了什么？你希望如何改进？" aria-label="问题详细说明"></textarea></label>`+menuRow('leaf:日志中心','bug','诊断日志','查看后可附在反馈中');saveLabel='查看反馈渠道';
    } else if(title==='复制推广文案') {
      body=`<textarea class="bc-form-control" rows="6" aria-label="推广文案">我在用蜜蜂记账 BeeCount：简单记录日常收支，数据由自己掌握。一起把日子记清楚。</textarea>`;saveLabel='复制文案';
    } else if(title.startsWith('配置云服务')) {
      body=field('服务地址','url','','https://cloud.example.com')+field('用户名','text','','输入账号')+field('密码或访问令牌','password','','输入凭据')+field('远端路径 / Bucket','text','','按服务类型设置');saveLabel='保存连接预览';
    } else {
      body=menuRow('demo-select','settings-2',title,'查看当前配置与相关选项')+`<div class="bc-label-row"><span>当前账本</span><span>${esc(state.ledger)}</span></div>`;
    }
    return `${subhead(title.split(':')[0])}${surface(body)}${btn('demo-save',saveLabel,saveLabel,'bc-primary')}<div class="bc-message-result" data-demo-result aria-live="polite"></div>`;
  }
  function captureLeaf(title) {
    const glyph=title==='语音记账'?'mic':title==='拍照记账'?'camera':title==='截图自动记账'?'scan-line':'images';
    return `${subhead(title)}${surface(`<div class="bc-brand-about"><div class="bc-avatar">${icon(glyph)}</div><h3>${title}</h3><p class="bc-small" style="margin-top:10px">${title==='语音记账'?'说一句：“午餐花了32元，微信付款”':'选择支付截图或票据，识别后确认账单'}</p></div>${title==='图片记账'||title==='拍照记账'?`<label class="bc-form-label">选择图片<input class="bc-form-control" type="file" accept="image/*" aria-label="选择识别图片" ${title==='拍照记账'?'capture="environment"':''}></label>`:title==='截图自动记账'?switchRow('screenshot','scan-line','启用截图记账','根据平台能力显示授权与引导'):btn('demo-capture',title==='语音记账'?'按下开始说话':'查看分享流程',title==='语音记账'?'开始录音':'查看分享流程','bc-secondary')}`)}${surface(`<div class="bc-between"><h3>识别结果</h3><span class="bc-small">示例</span></div><div class="bc-dual"><div><label>金额</label><strong>¥32.00</strong></div><div><label>分类</label><strong>餐饮</strong></div></div><div class="bc-label-row" style="margin-top:13px"><span>账户</span><span>微信</span></div><div class="bc-label-row"><span>标签</span>${tag('工作日')}</div>`)}${btn('page:editor','确认并编辑账单','确认并编辑账单','bc-primary')}`;
  }
  function storyLeaf(title) {
    const assets=title.includes('资产');

  }

    tweak.addSelect(settings,'skin',{label:'动态皮肤',options:[{label:'默认卡片',value:'none'},{label:'一岁星座',value:'anniversary'},{label:'周年蛋糕',value:'anniv_cake'}]});
    tweak.addToggle(settings,'animation',{label:'播放动效'});
    tweak.addToggle(settings,'immersive',{label:'整页动态背景'});
  }
})();
</script>
