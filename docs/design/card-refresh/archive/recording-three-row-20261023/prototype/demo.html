  Object.assign(state,{jCustomIcons:{饮品:jIconImages.coffee,奶茶:jIconImages.milk},jCustomIconFits:{饮品:'contain',奶茶:'contain'},jIconMode:'preset',jIconImage:jIconImages.milk,jIconFit:'contain',jIconOverrides:{}});
  const jSubIconDefinitions={早餐:'sunrise',午餐:'utensils',晚餐:'moon',零食:'cookie',咖啡:'coffee',奶茶:'cup-soda',酒水:'wine',公交地铁:'train-front',打车:'car-taxi-front',燃油:'fuel',停车:'square-parking',日用品:'shopping-basket',服饰:'shirt',生鲜:'carrot',房租:'house',水电:'droplets',物业:'building',电影:'clapperboard',游戏:'gamepad-2',旅行:'plane',书籍:'book-open',课程:'graduation-cap',门诊:'stethoscope',药品:'pill',礼物:'gift',红包:'mail',设备:'laptop',软件:'app-window',健身:'dumbbell',装备:'footprints',宠粮:'bone',洗护:'bath'};
  function jCategoryVisual(name,fallback='shapes'){const image=state.jCustomIcons[name];return image?`<img class="j-category-image" src="${esc(image)}" alt="${esc(name)}自定义图片" data-icon-category="${esc(name)}" data-fit="${state.jCustomIconFits[name]||'contain'}">`:icon(state.jIconOverrides[name]||jSubIconDefinitions[name]||fallback);}
  function gOriginalCategoryGrid(limit=7){const list=state.recordType==='income'?incomes:pAllCategories.slice(0,limit).concat([['更多分类','grid-2x2']]);let html='';for(let start=0;start<list.length;start+=4){const row=list.slice(start,start+4);html+=`<div class="p-category-row">${row.map(([n,i])=>{const extra=n==='更多分类'&&!pAllCategories.slice(0,limit).some(([name])=>name===state.category);return btn(n==='更多分类'?'p-morecategories':`p-parent:${n}`,`<span class="bc-entry-icon">${jCategoryVisual(n,i)}${pCategoryTree[n]||extra?'<span class="p-cat-chevron"></span>':''}</span><span>${n}</span>${extra?`<small class="w-more-selected">${esc(state.category)}</small>`:''}`,n,'p-category',`aria-pressed="${state.category===n||extra}" ${pCategoryTree[n]?`aria-expanded="${state.expandedCategory===n}"`:''}`);}).join('')}</div>`;if(state.fSeedMode!=='flat'&&row.some(([n])=>n===state.expandedCategory)&&pCategoryTree[state.expandedCategory])html+=`<div class="p-subcategories j-subcategories" aria-label="${state.expandedCategory}二级分类">${btn(`p-sub:${state.expandedCategory}:`,`${jCategoryVisual(state.expandedCategory,'shapes')}<span>${esc(state.expandedCategory)}</span>`,'仅选择'+state.expandedCategory,'',`aria-pressed="${!state.subcategory}"`)}${pCategoryTree[state.expandedCategory].map(n=>btn(`p-sub:${state.expandedCategory}:${n}`,`${jCategoryVisual(n)}<span>${esc(n)}</span>`,'选择'+n,'',`aria-pressed="${state.subcategory===n}"`)).join('')}</div>`;}return html;}
  function jIconPreview(image,fit='contain',status='ready'){return `<span class="j-icon-preview" data-fit="${fit}" data-state="${status}">${status==='loading'?'<span class="j-icon-loading"></span>':status==='error'?icon('shapes'):`<img src="${esc(image)}" alt="自定义分类图片预览">`}</span>`;}
  function jCategoryIconExamples(){return `${surface(`<h3>一级与二级分类</h3><p class="bc-small" style="margin:8px 0 18px">同一套图标容器，保留自定义图片原色。</p><div class="j-icon-examples">${[['餐饮','utensils'],['饮品','coffee'],['咖啡','coffee'],['奶茶','cup-soda']].map(([n,i])=>`<div><span class="bc-entry-icon">${jCategoryVisual(n,i)}</span><span>${n}</span><small>${state.jCustomIcons[n]?'自定义图片':'预设图标'}</small></div>`).join('')}</div>`)}${surface(`<h3>图片适配与异常状态</h3><div class="j-icon-examples">${[[jIconImages.milk,'contain','ready','透明 PNG'],[jIconImages.photo,'cover','ready','方形裁切'],['','contain','loading','加载中'],['','contain','error','加载失败']].map(([image,fit,status,title])=>`<div>${jIconPreview(image,fit,status)}<span>${title}</span></div>`).join('')}</div><p class="bc-small" style="margin-top:16px">图片不随主题色着色；选中态由容器和勾选表达。</p>`)}${fCTA('f-go:category-edit','编辑分类图标')}`;}

  function vPrepareForeign(code='USD'){state.fRecordCurrency=code;state.fRecordRate=String(vQuote(code)||'');state.vQuoteStatus=vQuote(code)?'ready':'error';state.vEditId=null;state.recordAccount=code==='USD'?'美元账户':'';state.amount='12.00';state.expression='12.00';state.category='饮品';state.subcategory='咖啡';state.expandedCategory='';state.note='一杯拿铁';}
  function vCurrencyBody(){const query=state.vCurrencyQuery.trim().toLowerCase(),match=c=>!query||[c.code,wCurrencyName(c),c.symbol].join(' ').toLowerCase().includes(query),common=vCommon.map(code=>wCurrencies.find(c=>c.code===code)).filter(Boolean),other=wCurrencies.filter(c=>!vCommon.includes(c.code));
    const rows=list=>list.filter(match).map(c=>{const rate=vQuote(c.code);return btn('v-use-currency:'+c.code,`<span class="v-currency-symbol">${esc(vSymbol(c.code))}</span><span class="v-currency-copy"><b>${c.code}<span>${esc(wCurrencyName(c))}</span></b><small>${c.code===state.fBaseCurrency?'账本本位币':rate?'1 '+c.code+' ≈ '+vRateText(rate)+' '+state.fBaseCurrency:'暂无汇率 · 选择后可手动补充'}</small></span><span class="v-currency-check">${state.fRecordCurrency===c.code?icon('check'):''}</span>`,'选择'+c.code+' '+wCurrencyName(c),'v-currency-row',`aria-pressed="${state.fRecordCurrency===c.code}"`);}).join('');
    const first=rows(common),rest=rows(other);return `<label class="p-search-box v-currency-search">${icon('search')}<input data-v-currency-query aria-label="搜索币种" placeholder="搜索币种名称、代码或符号" value="${esc(state.vCurrencyQuery)}"></label><div class="v-currency-list">${first?'<h4>常用币种</h4>'+first:''}${rest?'<h4>全部币种</h4>'+rest:''}${!first&&!rest?'<div class="p-empty">没有找到此币种</div>':''}</div><p class="v-currency-foot">汇率为示例；统计合计按 ${esc(state.fBaseCurrency)} 折算</p>`;
  }
  function vEditorPreview(){if(state.fRecordCurrency===state.fBaseCurrency||state.recordType==='transfer')return '';const calc=pCalcState();if(!calc.valid)return '<span class="bc-small">完成算式后预览折算金额</span>';if(state.vQuoteStatus==='loading')return `${icon('loader-circle')}正在获取汇率…`;if(!(Number(state.fRecordRate)>0))return btn('v-rate',`${icon('circle-alert')}汇率获取失败 · 手动补充${icon('chevron-right')}`,'汇率获取失败，手动补充汇率','v-rate-error');return `<span class="bc-num">≈ ${vSymbol(state.fBaseCurrency)}${money(vRound(calc.value*Number(state.fRecordRate)))}</span><small>1 ${esc(state.fRecordCurrency)} ≈ ${vRateText(state.fRecordRate)} ${esc(state.fBaseCurrency)}</small>`;}
  function vOpenCurrency(){state.vCurrencyQuery='';rOpenModal('currency-picker');}
  function vUseCurrency(code){if(code!==state.fRecordCurrency){state.fRecordCurrency=code;state.recordAccount='';state.fRecordRate=String(vQuote(code)||'');state.vQuoteStatus=Number(state.fRecordRate)>0?'ready':'error';}rDismiss();render();persist();}
  function vOpenRate(){state.vRateDraft=Number(state.fRecordRate)>0?String(state.fRecordRate):'';state.vRateError='';rOpenModal('exchange-rate');}
  function vRateBody(){return `<p class="v-rate-caption">暂时无法获取 ${esc(state.fRecordCurrency)} 汇率，补充后可继续保存。</p><div class="v-rate-equation"><span>1 ${esc(state.fRecordCurrency)}</span><span>=</span><label><input data-v-rate inputmode="decimal" type="text" aria-label="折算汇率" placeholder="输入汇率" value="${esc(state.vRateDraft)}"><span>${esc(state.fBaseCurrency)}</span></label></div><p class="v-rate-hint">仅用于本笔账单的折算。</p><p class="p-inline-error" data-v-rate-error role="alert">${esc(state.vRateError)}</p><div class="bc-inline-actions">${btn('r-close','取消','取消补充汇率','bc-secondary')}${btn('v-rate-confirm','确认汇率','确认汇率','bc-primary')}</div>`;}
  // Account currencies are visible and incompatible accounts are omitted.
  fDefs['account-picker'].body=()=>{const code=state.fRecordCurrency||state.fBaseCurrency,rows=accounts.filter(a=>state.recordType==='transfer'||a.currency===code);return `<p class="v-account-filter">${state.recordType==='transfer'?'全部账户':'仅显示 '+code+' 账户'}</p>${rows.length?surface(rows.map(a=>menuRow('g-use-account:'+a.name,a.icon,a.name,a.note,vSymbol(a.currency)+money(a.amount))).join('')):surface('<div class="p-empty">此币种暂无账户<br>可暂不设置，或新建账户</div>')}${btn('g-use-account:','不设置账户','不设置账户','bc-secondary')}${fLink('account-edit','plus','新增账户')}`;};
  root.addEventListener('input',e=>{if(e.target.matches('[data-v-currency-query]')){state.vCurrencyQuery=e.target.value;const pos=e.target.selectionStart;rBuildModal();const input=phone.querySelector('[data-v-currency-query]');input.focus({preventScroll:true});input.setSelectionRange(pos,pos);}if(e.target.matches('[data-v-rate]'))state.vRateDraft=e.target.value;if(e.target.dataset.pField==='expression'){const preview=phone.querySelector('[data-v-preview]');if(preview){preview.innerHTML=vEditorPreview();globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}}});
  root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [action,...parts]=el.dataset.action.split(':'),arg=parts.join(':');if(el.closest('.x-swipe')&&performance.now()<xGestureBlock){e.preventDefault();e.stopImmediatePropagation();return;}if(action==='page'&&arg==='editor'&&state.page!=='editor')state.vEditId=null;if(!action.startsWith('v-'))return;e.preventDefault();e.stopImmediatePropagation();
    if(action==='v-currency')vOpenCurrency();
    else if(action==='v-use-currency')vUseCurrency(arg);
    else if(action==='v-rate')vOpenRate();
    else if(action==='v-rate-confirm'){const value=Number(state.vRateDraft);if(!state.vRateDraft.trim()||!Number.isFinite(value)||value<=0||value>1e9){state.vRateError='请输入大于 0 的有效汇率';phone.querySelector('[data-v-rate-error]').textContent=state.vRateError;return;}state.fRecordRate=String(value);state.vQuoteStatus='ready';rDismiss();render();}
    else if(action==='v-row-category'){const row=pRows().find(r=>r.id===Number(arg));if(row){if(row.type==='transfer'){state.detailId=row.id;navigate('detail');}else{const child=dSubOf(row);dOpenCategory(dParentOf(row),child==='未细分'?'':child,row.type==='income'?'income':'expense');}}}
    persist();
  },true);

  function uLedgerInfo(){const family=state.ledger==='家庭账本',base={balance:family?23680.8:12860.5,records:family?542:1268,days:family?182:268},fixtures=family?familyItems:items,sign=r=>r.type==='transfer'?0:r.type==='income'?1:-1;let change=0,removed=0;for(const r of fixtures){if(pDeleted.has(r.id)){change-=sign(r)*vNative(r);removed++;}else if(pPatches[r.id]){const next={...r,...pPatches[r.id]};change+=sign(next)*vNative(next)-sign(r)*vNative(r);}}const added=state.additions.filter(r=>r.ledger===state.ledger&&!pDeleted.has(r.id)).map(r=>({...r,...pPatches[r.id]}));change+=added.reduce((sum,r)=>sum+sign(r)*vNative(r),0);return {...base,balance:vRound(base.balance+change),records:base.records+added.length-removed};}
  function uProfileHeader(){const name=state.displayName.trim();return `<div class="bc-profile u-profile">${btn('profile',`<img src="${brandImages.bee}" alt="">`,'编辑头像和资料','bc-avatar')}<div class="u-profile-copy">${btn('u-nickname',`<span class="u-greeting">你好，</span><span class="u-nickname">${esc(name||'设置昵称')}</span>${icon('pencil-line')}`,name?'编辑昵称，当前'+name:'设置昵称','u-name-button')}<div class="bc-small">${name?'简单记录，安心生活':'给自己的账本添一点温度'}</div></div>${btn('profile',icon('chevron-right'),'编辑个人资料')}</div>`;}
  function uLedgerSummary(){const info=uLedgerInfo();return surface(`<div class="u-ledger-heading">${btn('ledger',`${icon('book-open')}<b>${esc(state.ledger)}</b>${icon('chevron-down')}`,'切换当前账本','u-ledger-switch')}<div class="u-balance-label"><span>当前余额 · ${esc(state.fBaseCurrency)}</span>${btn('eye',icon(state.hide?'eye-off':'eye'),state.hide?'显示账本金额':'隐藏账本金额','u-balance-eye')}</div></div><div class="u-ledger-compact"><div class="u-ledger-balance bc-num" data-u-balance ${info.balance<0?'data-negative="true"':''}><span>${vSymbol(state.fBaseCurrency)}</span>${shown(info.balance)}</div><div class="u-ledger-stats"><div aria-label="已记账${info.days}天"><strong class="bc-num">${info.days}</strong><span>天</span></div>${btn('page:home',`<strong class="bc-num">${info.records.toLocaleString('en-US')}</strong><span>笔</span>`,'查看当前账本'+info.records+'笔账单','')}</div></div>`,'u-ledger-summary',true);}
  function uEnhanceMine(html){const t=document.createElement('template');t.innerHTML=html;t.content.querySelector('.bc-profile').outerHTML=uProfileHeader();const stats=t.content.querySelector('.bc-stat-grid');if(stats)stats.closest('.bc-surface').outerHTML=uLedgerSummary();return t.innerHTML;}
  function uNicknameBody(){return `<label class="u-name-field"><span>昵称</span><input data-u-nickname value="${esc(state.uNicknameDraft)}" placeholder="输入你的昵称" maxlength="20" aria-label="昵称" autocomplete="off"><small><span data-u-name-count>${Array.from(state.uNicknameDraft).length}</span> / 20</small></label><p class="p-inline-error" data-u-nickname-error role="alert">${esc(state.uNicknameError)}</p><div class="bc-inline-actions">${btn('r-close','取消','取消修改昵称','bc-secondary')}${btn('u-name-save','保存','保存昵称','bc-primary',state.uNicknameDraft.trim()?'':'disabled')}</div>`;}
  function uProfileBody(){return `${menuRow('u-nickname','pencil-line','昵称','点击修改',esc(state.displayName||'未设置'))}${menuRow('profile-gallery','images','从相册选择头像')}${menuRow('profile-camera','camera','拍摄头像')}${menuRow('profile-remove','trash-2','恢复默认头像')}`;}
  function uAttachments(r){if(!r?.attachment)return [];return Array.isArray(r.attachments)?r.attachments:state.uAttachmentCount&&r.id===1?uAttachmentExamples.slice(0,state.uAttachmentCount):[uAttachmentExamples[0]];}
  function uAttachmentGrid(r){const images=uAttachments(r);if(!images.length)return '';return surface(`<div class="bc-between"><h3>附件</h3><span class="bc-small">${images.length}张</span></div><div class="u-attachment-grid" data-count="${images.length}">${images.map((a,index)=>btn(`u-attachment:${r.id}:${index}`,`<img src="${a.src}" alt="${esc(a.title)}" loading="eager"><span>${icon('expand')}</span>`,`查看附件${index+1}，${a.title}`,'u-attachment-tile')).join('')}</div>`,'u-attachments');}
  function uEnhanceBillDetail(html){const r=pRows().find(r=>r.id===state.detailId)||pRows()[0]||items[0],t=document.createElement('template');t.innerHTML=html;const hero=t.content.querySelector('.bc-detail-amount')?.parentElement.querySelector('.bc-entry-icon');if(hero)hero.innerHTML=jCategoryVisual(r.subcategory||r.category,r.icon);const legacy=t.content.querySelector('[data-action="attachment-preview"]');if(legacy)legacy.closest('.bc-surface').outerHTML=uAttachmentGrid(r);return t.innerHTML;}
  function uAttachmentViewer(){const r=pRows().find(r=>r.id===state.uAttachmentBill)||items[0],images=uAttachments(r);state.uAttachmentIndex=Math.max(0,Math.min(images.length-1,state.uAttachmentIndex));const a=images[state.uAttachmentIndex];if(!a)return '<div class="p-empty">此账单暂无附件</div>';return `<div class="u-viewer-title"><span>${esc(a.title)}</span><span>${state.uAttachmentIndex+1} / ${images.length}</span></div><div class="u-attachment-stage"><img src="${a.src}" alt="${esc(a.title)}完整图片"></div><div class="u-viewer-meta">${esc(a.type)} · ${esc(a.size)}</div>${images.length>1?`<div class="u-viewer-thumbs" aria-label="切换附件">${images.map((image,index)=>btn('u-attachment-select:'+index,`<img src="${image.src}" alt="${esc(image.title)}">`,'查看第'+(index+1)+'张附件','',`aria-pressed="${index===state.uAttachmentIndex}"`)).join('')}</div>`:''}`;}
