<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二级分类长名称 · 交互探索</title><style>
:root{--bg:#f3f5f6;--paper:#fff;--ink:#282d30;--muted:#858b90;--soft:#f3f4f3;--line:#e9ecee;--accent:#facb16;--tint:#fff8df;--w:360px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}body.dark{--bg:#151719;--paper:#25282a;--ink:#f1f2f3;--muted:#9b9fa4;--soft:#303436;--line:#3c4144;--tint:#403a25}header,.tools,main{max-width:1320px;margin:auto;padding:24px}header{padding-bottom:12px}h1{font-size:28px;margin:6px 0}p{color:var(--muted);margin:0}small{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:.15em;color:#a38325}.tools{display:flex;gap:12px;align-items:center;padding-top:8px;padding-bottom:12px;flex-wrap:wrap}.tools label{font-size:12px}select,input,button{font:inherit;color:inherit}select,input{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}input{width:200px}button{cursor:pointer;border:0;background:none}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #639bd6;outline-offset:3px}.tools button{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}article{min-width:0}article h2{font-size:17px;margin:0 0 5px}article>p{font-size:12px;min-height:57px}.holder{margin:16px auto 0;max-width:var(--w);overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--bg)}.phone{width:100%;min-height:720px;padding:12px 12px 18px}.status{display:flex;justify-content:space-between;font-size:11px;padding:0 10px 14px}.head{display:flex;align-items:center;justify-content:space-between;margin:0 6px 10px}.tabs{display:flex;gap:5px;background:var(--soft);border-radius:10px;padding:3px}.tabs span{padding:4px 18px;font-size:12px}.tabs .active{background:var(--paper);border-radius:8px}.card{border-radius:20px;background:var(--paper);padding:14px;margin-bottom:9px}.amount-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.amount{font-size:32px;font-weight:650;letter-spacing:-1px;margin:5px 0}.amount small{font-size:17px;color:var(--ink)}.hint{font-size:10px;color:var(--muted)}.parents{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}.parent{text-align:center;font-size:11px}.icon{display:grid;place-items:center;width:34px;height:34px;margin:auto auto 4px;background:var(--soft);border-radius:12px}.parent.active .icon{background:var(--accent);color:#282d30}svg{width:18px;height:18px;flex:none}.children{background:var(--soft);border-radius:13px;padding:6px;gap:5px}.chip{display:flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;padding:8px 10px;min-height:40px;font-size:11px;line-height:1.4}.chip svg{width:15px;height:15px}.chip.selected{background:var(--paper);color:#aa8411;box-shadow:0 1px 5px #00000004}.children.a{display:flex;overflow-x:auto;scrollbar-width:thin;scroll-snap-type:x proximity}.a .chip{flex:none;white-space:nowrap;scroll-snap-align:start}.children.b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.b .chip{flex-direction:column;padding:7px 3px;height:69px;gap:4px}.b .chip span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center;overflow-wrap:anywhere}.children.c{display:grid;grid-template-columns:1fr 1fr}.c .chip{justify-content:start;min-height:42px;padding:7px;font-size:11px}.c .chip span{overflow-wrap:anywhere}.chosen{font-size:10px;color:var(--muted);margin:9px 2px 0;min-height:30px;overflow-wrap:anywhere}.remaining{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.form{font-size:11px}.form-row{display:flex;align-items:center;justify-content:space-between;gap:7px}.form-row+div{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}.form-row input{border:0;background:none;padding:0;font-size:11px;min-width:0;width:100%;outline:0}.tag{background:var(--tint);color:#a38325;border-radius:9px;padding:1px 7px;font-size:9px}.keyboard{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.key{height:41px;display:grid;place-items:center;background:var(--paper);border-radius:11px;font-size:22px}.key.op{color:#a38325;background:var(--tint)}.actions{display:grid;grid-template-columns:1fr .8fr 1.7fr;gap:5px;margin-top:6px}.actions button{font-size:11px;height:39px;border-radius:11px;background:var(--paper)}.actions button:last-child{background:var(--accent);color:#282d30}.home-line{width:100px;height:4px;background:var(--ink);border-radius:4px;margin:15px auto 0}.note{font-size:11px;color:var(--muted);padding:12px 2px}.footer{max-width:1272px;margin:8px auto 35px;background:var(--paper);border-radius:18px;padding:20px;font-size:12px}.footer b{color:var(--ink)}@media(max-width:1050px){main{grid-template-columns:1fr;max-width:500px}.holder{max-width:var(--w)}article>p{min-height:0}}@media(max-width:420px){header,.tools,main{padding-left:12px;padding-right:12px}h1{font-size:24px}.footer{margin:10px 12px 25px}}
</style><header><div class="eyebrow">BEECOUNT · 二级分类长名称 · 待确认</div><h1>名称再长，也先让人认得清。</h1><p>保留图标与选中态。三种都能点击选择、切换屏宽和深色；合成示例不会修改 App 数据。</p></header><div class="tools"><label>屏宽 <select id="width"><option value="360">360 · 常规</option><option value="320">320 · 小屏</option><option value="398">398 · 标准</option></select></label><label>名称 <input id="custom" placeholder="输入自定义长分类名"></label><button id="add">加入示例</button><button id="theme">切换浅深色</button></div><main id="boards"></main><div class="footer"><b>建议 A：名称决定宽度，横向滚动。</b>保持原来的两行分类区高度和记账节奏，不再按四列强行截断二级名称；选中项自动露出。B 适合希望同时看更多选项的人；C 完整名称最清楚，但分类区域会更高。英文和超长名称同样保留，点选后下方展示完整名称。此处仅评审，Flutter 暂不改二级名称布局。</div><script src="../prototype/vendor/lucide.min.js"></script><script>
const names=['咖啡','工作日午餐','交通通勤费用','健身与运动装备','医疗检查与药品','Food & groceries'];let selected='咖啡';const descriptions={a:['A · 自然宽度横滑（推荐）','标签随文字变宽，图标＋名称保持一行，选中后自动露出。'],b:['B · 图标在上，两行名称','三列排布，5–8 字名称可完整阅读；极长名称仍需选中查看。'],c:['C · 双列，完整换行','图标在左，名称完整换行；最多显示两行区域并可纵向滚动。']};
function icon(name){return '<i data-lucide="'+name+'"></i>'}function render(){document.querySelector('#boards').innerHTML=Object.entries(descriptions).map(([mode,[title,desc]])=>`<article><h2>${title}</h2><p>${desc}</p><div class="holder"><div class="phone"><div class="status"><b>9:41</b><span>▂▃▅　◉ ▰</span></div><div class="head">‹<div class="tabs"><span class="active">支出</span><span>收入</span><span>转账</span></div>···</div><div class="card"><div class="amount-top"><span>CNY⌄</span><span>日常生活⌄</span></div><div class="amount"><small>¥</small>32.00</div><div class="hint">支持 ＋ − × ÷ 四则运算</div></div><div class="card"><div class="parents">${['餐饮','饮品','交通','购物'].map((x,i)=>`<div class="parent ${i===0?'active':''}"><div class="icon">${icon(['utensils','coffee','train-front','shopping-basket'][i])}</div>${x}</div>`).join('')}</div><div class="children ${mode}"></div><div class="chosen"></div><div class="remaining">${['居家','娱乐','文教','更多分类'].map((x,i)=>`<div class="parent"><div class="icon">${icon(['house','clapperboard','book-open','grid-2x2'][i])}</div>${x}</div>`).join('')}</div></div><div class="card form"><div class="form-row">${icon('pencil-line')}<input value="一杯拿铁" aria-label="备注">${icon('image-plus')}</div><div class="form-row"><span>▣ 微信⌄</span><span>▦ 10月28日</span><span class="tag">工作日</span></div></div><div class="keyboard">${['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'].map((x,i)=>`<div class="key ${i%4===3?'op':''}">${x}</div>`).join('')}</div><div class="actions"><button>再记一笔</button><button>=</button><button>✓ 保存</button></div><div class="home-line"></div></div></div><div class="note">${mode==='a'?'左右滑动查看全部，点击后自动定位选中项。':mode==='b'?'点选后下方保留完整名称；长名称不缩成小字。':'双列文字自然换行；小屏只在分类区域滚动。'}</div></article>`).join('');document.querySelectorAll('article').forEach((article,index)=>{const mode=['a','b','c'][index],list=article.querySelector('.children');if(mode==='c')list.style.cssText='max-height:110px;overflow:auto';for(const name of names){const b=document.createElement('button');b.className='chip'+(name===selected?' selected':'');b.title=name;b.setAttribute('aria-pressed',name===selected);b.innerHTML=icon('coffee');const text=document.createElement('span');text.textContent=name;b.append(text);b.onclick=()=>{selected=name;document.querySelectorAll('.chip').forEach(x=>{const on=x.title===name;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on)});document.querySelectorAll('.chosen').forEach(x=>x.textContent='已选：餐饮 / '+name);b.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});};list.append(b)}article.querySelector('.chosen').textContent='已选：餐饮 / '+selected});lucide.createIcons();}document.querySelector('#width').onchange=e=>document.documentElement.style.setProperty('--w',e.target.value+'px');document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#add').onclick=()=>{const v=document.querySelector('#custom').value.trim();if(v&&!names.includes(v)){names.push(v);render()}};render();
</script></html>
